# No secrets in this file. See README.md for the environment variables.

rebrickable.api.key=${REBRICKABLE_API_KEY}

# Secret must be at least 32 characters (HMAC-SHA256).
rebrickable.jwt.secret=${JWT_SECRET}
rebrickable.jwt.expiration=${JWT_EXPIRATION:86400000}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/rebrickable}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
