# No secrets belong in this file. Every sensitive value is read from the
# environment; see README.md for the list of variables and how to set them.

# --- Rebrickable API ---
# Generate a key on your Rebrickable profile settings page.
rebrickable.api.key=${REBRICKABLE_API_KEY}

# --- JWT ---
# HMAC-SHA256 signing secret. Must be at least 32 characters.
rebrickable.jwt.secret=${JWT_SECRET}
# Token lifetime in milliseconds (default: 24 hours).
rebrickable.jwt.expiration=${JWT_EXPIRATION:86400000}

# --- MongoDB ---
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/rebrickable}
