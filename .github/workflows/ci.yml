name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Java 21, MongoDB 7)
    runs-on: ubuntu-24.04

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        working-directory: rebrickable-parent
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: lego-collection-frontend/package-lock.json

      - name: Install dependencies
        working-directory: lego-collection-frontend
        run: npm ci

      - name: Build
        working-directory: lego-collection-frontend
        run: npm run build
        env:
          CI: false
